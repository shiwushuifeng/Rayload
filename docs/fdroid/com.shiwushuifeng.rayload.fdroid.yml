# F-Droid metadata for Rayload.
#
# The F-Droid build sets RAYLOAD_FDROID=1, so the resulting applicationId is
# com.shiwushuifeng.rayload.fdroid. fdroiddata requires the metadata filename to
# match that applicationId.
#
# Reviewer notes:
# * `--features fdroid,plugin_engine` is required: `fdroid` is an additive Cargo
#   feature, so passing it alone would compile out the LAN and plugin entries.
# * The tag is v1.0.4.1, but four-part versions are not valid semver, so the
#   build reports versionName 1.0.4 via RAYLOAD_VERSION_NAME. versionCode 10016
#   is monotonic.
# * The aria2-next engine is downloaded from the upstream GitHub release of
#   AnInsomniacy/aria2-next (GPL-2.0-or-later) and verified against the SHA-256
#   published there, rather than shipping an unattributable binary.

Categories:
  - Internet
License: GPL-3.0-only
AuthorName: shiwushuifeng
WebSite: https://github.com/shiwushuifeng/Rayload
SourceCode: https://github.com/shiwushuifeng/Rayload
IssueTracker: https://github.com/shiwushuifeng/Rayload/issues
Changelog: https://github.com/shiwushuifeng/Rayload/blob/main/docs/CHANGELOG.md

AutoName: Rayload

Description: |-
  Rayload is a fast, private and customizable download manager for Android. It
  runs a single Aria2 Next engine for HTTP, HTTPS, FTP, BitTorrent, Magnet,
  Metalink and ED2K, with no ads, accounts or telemetry.

  Features include a mobile-first task list, share-to-download, background
  foreground service, speed limits, BitTorrent file selection, a floating speed
  dashboard, keep-awake mode and a recoverable file trash.

  Rayload 1.0.4 adds mutual LAN pairing with fingerprint verification,
  cross-device task handoff, all-device statistics and a permission-checked JSON
  plugin sandbox. A separate headless Linux CLI is available for NAS and server
  deployments.

  Rayload is an independent, unofficial Android port based on Rayburst by
  AnInsomniacy and is licensed under GPL-3.0-only.

RepoType: git
Repo: https://github.com/shiwushuifeng/Rayload.git

Builds:
  - versionName: 1.0.4
    versionCode: 10016
    commit: 71b13f511fb2623a5c071b7b7d7d1d867ba2e6b1
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm openjdk-21-jdk-headless
    prebuild:
      - curl -fsSL -o src-tauri/binaries/aria2-next-aarch64-linux-android https://github.com/AnInsomniacy/aria2-next/releases/download/v3.1.1/aria2-next-3.1.1-android-arm64
      - echo "8f06939d8786c06204a099a3b9ff19d76ce063f62781eed155d9f3dbf04ea973  src-tauri/binaries/aria2-next-aarch64-linux-android" | sha256sum -c -
      - chmod +x src-tauri/binaries/aria2-next-aarch64-linux-android
      - npm install -g pnpm@11.5.2
      - pnpm install --frozen-lockfile
      - rustup target add aarch64-linux-android
      - pnpm android:prepare
    build:
      - env RAYLOAD_FDROID=1 RAYLOAD_VERSION_NAME=1.0.4 pnpm tauri android build --apk --target aarch64 --features fdroid,plugin_engine
    ndk: 29.0.14206865
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
