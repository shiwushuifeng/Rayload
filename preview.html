<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayload Final Slant Concepts</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #08080a;
        color: #f8f2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% -10%, #321a43 0, transparent 44%),
          #08080a;
      }

      main {
        width: min(1180px, 100%);
      }

      header {
        margin-bottom: 34px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(30px, 4vw, 50px);
        font-weight: 760;
        letter-spacing: -0.045em;
      }

      header p {
        margin: 0;
        color: #a79daf;
        font-size: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .concept {
        padding: 28px;
        border: 1px solid #2d2631;
        border-radius: 28px;
        background: linear-gradient(145deg, #17131a, #0e0d10 74%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 38%);
      }

      .stage {
        display: grid;
        min-height: 284px;
        place-items: center;
      }

      .stage img {
        width: min(236px, 100%);
        aspect-ratio: 1;
        filter: drop-shadow(0 20px 32px rgb(168 85 247 / 16%));
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 20px;
      }

      h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.025em;
      }

      .badge {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid #56386a;
        border-radius: 11px;
        background: #24142f;
        color: #d8b4fe;
        font-size: 14px;
        font-weight: 800;
      }

      .description {
        min-height: 42px;
        margin: 9px 0 18px;
        color: #a79daf;
        font-size: 14px;
        line-height: 1.5;
      }

      .dock {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid #2a242e;
      }

      .dock img {
        width: 52px;
        height: 52px;
      }

      .dock span {
        color: #746b79;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .concept {
          display: grid;
          grid-template-columns: minmax(180px, 0.8fr) 1.2fr;
          gap: 24px;
        }

        .stage {
          min-height: auto;
        }

        .copy {
          align-self: center;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 28px 14px;
        }

        .concept {
          display: block;
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Final slant variants</h1>
        <p>Two weight and detail variations of the selected line icon.</p>
      </header>

      <section class="grid" aria-label="Dual-arrow icon concepts">
        <article class="concept">
          <div class="stage">
            <img src="icon-b.svg" alt="Weighted line dual-arrow icon" />
          </div>
          <div class="copy">
            <div class="title-row">
              <h2>Solid Weight</h2>
              <span class="badge">1</span>
            </div>
            <p class="description">Heavier rounded strokes give the icon a grounded, confident presence.</p>
            <div class="dock">
              <img src="icon-b.svg" alt="" />
              <span>Dock scale</span>
            </div>
          </div>
        </article>

        <article class="concept">
          <div class="stage">
            <img src="icon-c.svg" alt="Gradient accent dual-arrow icon" />
          </div>
          <div class="copy">
            <div class="title-row">
              <h2>Gradient Accent</h2>
              <span class="badge">2</span>
            </div>
            <p class="description">A fine outline with a compact gradient-filled upper signal.</p>
            <div class="dock">
              <img src="icon-c.svg" alt="" />
              <span>Dock scale</span>
            </div>
          </div>
        </article>

      </section>
    </main>
  </body>
</html>
