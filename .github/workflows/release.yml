name: Release

# Required repository secrets for SIGNED releases:
#   ANDROID_KEYSTORE_BASE64   base64-encoded release keystore (.jks)
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEYSTORE_PASSWORD keystore and key password
#
# Without those secrets the build still runs and produces an unsigned APK, but
# the GitHub Release step is skipped so an unsigned package is never published.
on:
  push:
    tags:
      - 'v*'
  # Manual runs validate the toolchain without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth shared with local builds.
          node-version-file: '.node-version'
          cache: pnpm

      # rust-toolchain.toml pins the exact compiler and target, so CI and local
      # builds use the same rustc instead of whatever stable happens to be.
      - name: Set up Rust
        run: |
          CHANNEL=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$CHANNEL" ]; then
            echo '::error::rust-toolchain.toml has no channel'
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal --target aarch64-linux-android
          rustup override set "$CHANNEL"
          rustc -V

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `android-actions/setup-android` is not used: it runs `sdkmanager tools`,
      # and the legacy `tools` package no longer exists in the SDK repository, so
      # the action fails before anything is built. The runner image already ships
      # a complete SDK, so only the paths and cmdline-tools have to be exposed.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE_BIN=$(find "$SDK/cmdline-tools" -maxdepth 3 -type d -name bin | sort -V | tail -1)
          if [ -z "$CMDLINE_BIN" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          "$CMDLINE_BIN/sdkmanager" --version

      # Package names must match the published repository: the platform is
      # `platforms;android-37.0`, there is no plain `platforms;android-37`.
      - name: Install Android platform, build tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > src-tauri/gen/android/local.properties

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing; this run builds an unsigned APK and will not publish a release."
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
          } > signing/keystore.properties
          echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Android project configuration
        run: pnpm android:prepare

      # `plugin_engine` must be enabled: without it the build hides the LAN and
      # plugin entries, so the APK would ship with missing features.
      - name: Build release APK
        run: pnpm tauri android build --apk --target aarch64 --features plugin_engine

      - name: Collect APK and checksum
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from src-tauri/Cargo.toml" >&2
            exit 1
          fi

          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)

          APK=""
          for candidate in "${APKS[@]}"; do
            case "$candidate" in
              *universal*release*.apk) APK="$candidate"; break ;;
            esac
          done
          if [ -z "$APK" ]; then
            for candidate in "${APKS[@]}"; do
              case "$candidate" in
                *arm64*release*.apk|*aarch64*release*.apk) APK="$candidate"; break ;;
              esac
            done
          fi
          if [ -z "$APK" ]; then
            APK=$(printf '%s\n' "${APKS[@]}" | grep '/release/' | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi

          OUTPUT="Rayload-${VERSION}-android-arm64-v8a.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          echo "APK_PATH=$OUTPUT" >> "$GITHUB_ENV"
          echo "Built $OUTPUT from $APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayload-android-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error

      # Publishing needs both a tag push and working signing secrets, so a
      # manual run or a secret-less run can never ship an unsigned package.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
