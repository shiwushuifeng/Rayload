name: Recover signing key

# TEMPORARY workflow. It exports the release keystore that lives in repository
# secrets, because GitHub secrets are write-only and cannot be read back
# through the UI or API.
#
# The artifact is encrypted with AES-256-CBC when the secret
# RECOVERY_PASSPHRASE exists. Create that secret with any passphrase you can
# remember (password manager, 20+ characters) before running this workflow.
#
# Without RECOVERY_PASSPHRASE the workflow still runs, but it uploads the
# keystore unencrypted and prints a loud warning. Only acceptable on a private
# repository that nobody else can read.
#
# Trigger manually (Actions -> Run workflow) or by pushing the tag `test`.
#
# Restore on a machine that has openssl:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in signing-recovery.tar.gz.enc -out signing-recovery.tar.gz \
#     -pass pass:'<RECOVERY_PASSPHRASE>'
#   tar xzf signing-recovery.tar.gz

on:
  workflow_dispatch:
  push:
    tags:
      - test

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_PASSPHRASE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing; nothing to recover."
            exit 1
          fi
          if [ -n "$RECOVERY_PASSPHRASE" ]; then
            echo "RECOVERY_ENCRYPTED=true" >> "$GITHUB_ENV"
            echo "Artifact will be encrypted with RECOVERY_PASSPHRASE."
          else
            echo "RECOVERY_ENCRYPTED=false" >> "$GITHUB_ENV"
            echo "::warning::RECOVERY_PASSPHRASE is not set; the keystore will be uploaded UNENCRYPTED. Delete the artifact immediately after downloading it."
          fi

      - name: Export keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
          } > signing/keystore.properties

          # Certificate details are public information; print them so the owner
          # can compare fingerprints before downloading the artifact.
          keytool -list -v -keystore signing/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > signing/certificate.txt 2>&1
          grep -E 'Alias name|SHA256:|Valid from' signing/certificate.txt || true
          sha256sum signing/release.jks > signing/release.jks.sha256

      - name: Encrypt payload
        if: env.RECOVERY_ENCRYPTED == 'true'
        env:
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_PASSPHRASE }}
        run: |
          tar czf signing-recovery.tar.gz -C signing .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in signing-recovery.tar.gz \
            -out signing-recovery.tar.gz.enc \
            -pass env:RECOVERY_PASSPHRASE
          rm -rf signing signing-recovery.tar.gz
          ls -l signing-recovery.tar.gz.enc

      - name: Package payload
        if: env.RECOVERY_ENCRYPTED != 'true'
        run: |
          tar czf signing-recovery.tar.gz -C signing .
          rm -rf signing
          ls -l signing-recovery.tar.gz

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-recovery
          path: |
            signing-recovery.tar.gz
            signing-recovery.tar.gz.enc
          retention-days: 1
          if-no-files-found: error

      - name: Reminder
        run: |
          echo "::warning::Download the artifact, restore signing/ locally, then delete the run, the artifact, the tag, and this workflow."
