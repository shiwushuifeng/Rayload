name: Recover signing key

# TEMPORARY workflow. It exports the release keystore that lives in repository
# secrets, because GitHub secrets are write-only and cannot be read back
# through the UI or API.
#
# The artifact is encrypted with AES-256-CBC using the keystore password that
# is already stored in ANDROID_KEYSTORE_PASSWORD, so a leaked artifact alone is
# not enough to sign anything.
#
# Trigger either manually (Actions -> Run workflow) or by pushing the tag
# `test`. Delete the tag, the artifact, and this file once the key is back.
#
# Restore on a machine that has openssl:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in signing-recovery.tar.gz.enc -out signing-recovery.tar.gz \
#     -pass pass:'<ANDROID_KEYSTORE_PASSWORD>'
#   tar xzf signing-recovery.tar.gz

on:
  workflow_dispatch:
  push:
    tags:
      - test

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing; nothing to recover."
            exit 1
          fi

      - name: Export keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
          } > signing/keystore.properties

          # Certificate details are public information; print them so the owner
          # can compare fingerprints before downloading the artifact.
          keytool -list -v -keystore signing/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > signing/certificate.txt 2>&1
          grep -E 'Alias name|SHA256:|Valid from' signing/certificate.txt || true
          sha256sum signing/release.jks > signing/release.jks.sha256

      - name: Encrypt payload
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tar czf signing-recovery.tar.gz -C signing .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in signing-recovery.tar.gz \
            -out signing-recovery.tar.gz.enc \
            -pass env:ANDROID_KEYSTORE_PASSWORD
          rm -rf signing signing-recovery.tar.gz
          ls -l signing-recovery.tar.gz.enc

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-recovery
          path: signing-recovery.tar.gz.enc
          retention-days: 1
          if-no-files-found: error

      - name: Reminder
        run: |
          echo "::warning::Download the artifact, decrypt it with ANDROID_KEYSTORE_PASSWORD, restore signing/ locally, then delete the run, the artifact, the tag, and this workflow."
